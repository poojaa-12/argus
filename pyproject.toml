[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argus"
version = "0.2.0"
description = "LangGraph Deep Research and Operator runtime with reliability controls"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.45",
    "langchain-core>=0.3.0",
    "pydantic>=2.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "redis>=5.0.0",
    "psycopg[binary]>=3.1.0",
    "tiktoken>=0.7.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
]
openai = [
    "langchain-openai>=0.2.0",
]
redis-ckpt = [
    "langgraph-checkpoint-redis>=0.0.4",
]

[tool.setuptools.packages.find]
include = ["argus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
